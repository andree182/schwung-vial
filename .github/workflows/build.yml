name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      - name: Verify binary exports
        run: |
          file dist/vial/dsp.so
          nm -D --defined-only dist/vial/dsp.so | grep -q "move_plugin_init_v2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vial-module
          path: dist/vial-module.tar.gz
